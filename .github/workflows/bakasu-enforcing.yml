
name: Build TouchDirt Kernel, BakaSU, Enforcing

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      bakasu_sha:
        required: true
        type: string
      nomount_sha:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout frozen kernel source
      uses: actions/checkout@v7.0.1
      with:
        ref: v1.0.3

    - name: Integrating pinned BakaSU revision
      env:
        BAKASU_SHA: ${{ inputs.bakasu_sha }}
      run: |
        echo "[-] Cloning BakaSU repo at $BAKASU_SHA..."
        git clone https://github.com/Baka-SU/BakaSU.git KernelSU
        git -C KernelSU checkout "$BAKASU_SHA"

        echo "[-] Setup BakaSU..."
        chmod +x ./KernelSU/kernel/setup.sh
        ./KernelSU/kernel/setup.sh

        rm -rf KernelSU
        git clone https://github.com/Baka-SU/BakaSU.git KernelSU
        git -C KernelSU checkout "$BAKASU_SHA"

    - name: SUSFS
      shell: bash
      run: |
        git clone https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd --depth 1 SUSFS

        echo "[-] Applying upstream SUSFS 4.19 core..."

        if patch --batch --forward -p1 < SUSFS/Patches/Patch/susfs_patch_to_4.19.patch; then
          patch_status=0
        else
          patch_status=$?
        fi

        if [[ "$patch_status" -gt 1 ]]; then
          echo "[-] SUSFS core patch encountered a fatal error!"
          exit 1
        fi

        expected_rejects=$'fs/namespace.c.rej\nfs/proc/task_mmu.c.rej\nfs/super.c.rej\nkernel/sys.c.rej'
        actual_rejects="$(find . -type f -name '*.rej' -printf '%P\n' | sort)"

        if [[ "$patch_status" -eq 1 ]]; then
          if [[ "$actual_rejects" != "$expected_rejects" ]]; then
            echo "[-] Unexpected SUSFS patch rejection!"
            printf '%s\n' "$actual_rejects"
            exit 1
          fi

          [[ "$(grep -c '^@@' fs/namespace.c.rej)" -eq 1 ]]
          [[ "$(grep -c '^@@' fs/proc/task_mmu.c.rej)" -eq 2 ]]
          [[ "$(grep -c '^@@' fs/super.c.rej)" -eq 1 ]]
          [[ "$(grep -c '^@@' kernel/sys.c.rej)" -eq 1 ]]
        elif [[ -n "$actual_rejects" ]]; then
          echo "[-] Patch produced reject files despite reporting success!"
          exit 1
        fi

        echo "[-] Validating existing compatibility code..."

        grep -Fq '#include <linux/susfs_def.h>' fs/namespace.c
        grep -Fq '#include <linux/jump_label.h>' fs/namespace.c
        grep -Fq '#define CL_COPY_MNT_NS BIT(25)' fs/namespace.c
        grep -Fq 'SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))' fs/proc/task_mmu.c
        grep -Fq 'for (vma = priv->mm->mmap; vma;)' fs/proc/task_mmu.c
        grep -Fq 'susfs_is_sdcard_android_data_not_decrypted' fs/super.c
        grep -Fq 'susfs_spoof_uname(&tmp);' kernel/sys.c

        echo "[+] SUSFS core applied and compatibility checks passed!"

        find block fs include kernel mm security -type f \( -name '*.orig' -o -name '*.rej' \) -delete

        echo "[-] Applying existing SUSFS inline hooks..."

        chmod +x ./SUSFS/Patches/susfs_inline_hook_patches.sh
        ./SUSFS/Patches/susfs_inline_hook_patches.sh

    - name: Integrating pinned NoMount revision
      env:
        NOMOUNT_SHA: ${{ inputs.nomount_sha }}
      run: |
        echo "[-] Cloning NoMount at $NOMOUNT_SHA..."

        git clone https://github.com/maxsteeel/nomount.git NoMount
        git -C NoMount checkout "$NOMOUNT_SHA"

        echo "[-] Setup NoMount..."
        chmod +x ./NoMount/kernel/setup.sh
        bash ./NoMount/kernel/setup.sh

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex libssl-dev gcc g++ clang python3 \
          libncurses5-dev ccache make git zip wget xz-utils \
          device-tree-compiler libfdt-dev gcc-arm-linux-gnueabi cpio

    - name: Prepare Toolchains directories
      run: |
        mkdir -p toolchain/gcc
        mkdir -p toolchain/clang

    - name: Download GCC & Clang Toolchain
      run: |
        cd toolchain/gcc
        wget -q --show-progress --retry-connrefused --waitretry=2 --read-timeout=30 -t 5 \
          https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz || \
        wget -q --show-progress \
          https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
        tar -xf gcc.tar.xz -C ./

        cd ../clang
        wget -q --show-progress \
          https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902.tar.gz -O clang.tar.gz
        mkdir -p host/linux-x86/clang-r383902
        tar -xzf clang.tar.gz -C host/linux-x86/clang-r383902

    - name: Set Environment Variables
      run: |
        CLANG_PATH="$(pwd)/toolchain/clang/host/linux-x86/clang-r383902/bin"
        GCC_PATH="$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin"

        echo "$CLANG_PATH" >> $GITHUB_PATH

        echo "CROSS_COMPILE=$GCC_PATH/aarch64-none-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "AR=llvm-ar" >> $GITHUB_ENV
        echo "NM=llvm-nm" >> $GITHUB_ENV
        echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
        echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
        echo "STRIP=llvm-strip" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "KCFLAGS=-w -I$(pwd)/out/security/selinux -I$(pwd)/security/selinux/include -I$(pwd)/security/selinux/ss -I$(pwd)/out/security/selinux/ss" >> $GITHUB_ENV
        echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> $GITHUB_ENV

    - name: Configure and Compile Kernel
      run: |
        make -C $(pwd) O=$(pwd)/out touchdirt-a04_defconfig

        if [ -f "arch/arm64/configs/touchdirt.config" ]; then
          ./scripts/kconfig/merge_config.sh -O "$(pwd)/out" "$(pwd)/out/.config" arch/arm64/configs/touchdirt.config
        fi

        grep '^CONFIG_LOCALVERSION=' out/.config

        sed -i 's/CONFIG_IKHEADERS=y/CONFIG_IKHEADERS=n/g' $(pwd)/out/.config

        if [ -n "${{ inputs.version }}" ]; then
            sed -i "s/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=\"-TouchDirt-BakaSU-${{ inputs.version }}\"/" out/.config
        else
            sed -i "s/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=\"-TouchDirt-BakaSU-BETA\"/" out/.config
        fi

        make -C $(pwd) O=$(pwd)/out olddefconfig

        make -C $(pwd) O=$(pwd)/out prepare
        make -C $(pwd) O=$(pwd)/out scripts
        make -C $(pwd) O=$(pwd)/out security/

        make -C $(pwd) O=$(pwd)/out -j$(nproc) || make -C $(pwd) O=$(pwd)/out -j1

    - name: Get kernel version
      id: version
      run: |
        VERSION="${{ inputs.version }}"
        echo "VERSION=$VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Package AnyKernel3
      run: |
        DATE=$(date -u +"%Y-%m-%d")

        git clone https://github.com/DaniTheSillyFem/AnyKernel3 --depth 1

        cp out/arch/arm64/boot/Image AnyKernel3/Image

        cd AnyKernel3
        zip -r9 "../TouchDirt-BakaSU-${{ steps.version.outputs.version }}-${DATE}.zip" . -x ".git/*"

    - name: Upload AnyKernel3 ZIP
      uses: actions/upload-artifact@v7.0.1
      with:
        name: TouchDirt-BakaSU-Enforcing
        path: TouchDirt-*.zip

